baseURL = "https://kuaisou-tech.github.io/"
languageCode = "zh-CN"
title = "Kuaisou | 快搜"
theme = "PaperMod"
[pagination]
  pagerSize = 10
enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

[minify]
  disableXML = true
  minifyOutput = true

[params]
  env = "production"
  title = "Kuaisou"
  description = "深度学习研究笔记 · 论文解读 · 技术分享"
  keywords = ["深度学习", "机器学习", "AI", "论文解读", "研究笔记"]
  author = "Kuaisou Team"
  DateFormat = "2006-01-02"
  defaultTheme = "auto"
  disableThemeToggle = false
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  comments = false
  hidemeta = false
  hideSummary = false
  showtoc = true
  tocopen = false

  [params.homeInfoParams]
    Title = "Kuaisou · 快搜"
    Content = """
欢迎来到 Kuaisou 博客。我们是一支专注于深度学习研究的小团队，成立于 2010 年。\
这里记录我们的研究笔记、论文解读与技术分享。
"""

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/Kuaisou-Tech"

  [[params.socialIcons]]
    name = "rss"
    url = "/index.xml"

[params.cover]
  hidden = false
  hiddenInList = false
  hiddenInSingle = false

[params.editPost]
  URL = "https://github.com/Kuaisou-Tech/kuaisou.github.io/edit/main/content"
  Text = "在 GitHub 上编辑"
  appendFilePath = true

[params.fuseOpts]
  isCaseSensitive = false
  shouldSort = true
  location = 0
  distance = 1000
  threshold = 0.4
  minMatchCharLength = 0
  limit = 10
  keys = ["title", "permalink", "summary", "content"]

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "文章"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "tags"
    name = "标签"
    url = "/tags/"
    weight = 20
  [[menu.main]]
    identifier = "about"
    name = "关于"
    url = "/about/"
    weight = 30
  [[menu.main]]
    identifier = "search"
    name = "搜索"
    url = "/search/"
    weight = 40

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
    anchorLineNos = true
    codeFences = true
    guessSyntax = true
    lineNos = true
    style = "monokai"

[outputs]
  home = ["HTML", "RSS", "JSON"]
